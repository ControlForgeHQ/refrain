# This is the initial editable configuration installed by --initialize.
general:
  day_start: "05:00"

reveal:
  source: "12:00"
  attribution: "18:00"

information_view:
  duration: 60

display:
  # The image server is loopback-only by default. Configure "window" or
  # "waveshare-13in3-e" here to use a desktop or attached display instead.
  backends:
    - type: "image-server"
      host: "127.0.0.1"
      port: 8080
      outputs:
        - id: "default"

layout:
  presentation_insets:
    left: 384
    right: 384
    top: 324
    bottom: 324

  fonts:
    default:
      - "alegreya"
      - "libre-baskerville"
      - "lora"
      - "source-sans-3"
    font_faces:
      source: italic

  backgrounds:
    default:
      - "none"
      - "aged-paper"
      - "canvas"
      - "cloth"
      - "drafting-grid"
      - "handmade-paper"
      - "hex"
      - "isometric-grid"
      - "limestone"
      - "recursive-squares"
      - "vellum"

  decorations:
    default:
      - "none"
      - "ethereal"
      - "hex"
      - "lower-flourish"
      - "simple-border"
      - "top-bottom-borders"
    colors:
      - "black"

  text:
    colors:
      - "black"
    min_font_size: 56
    max_font_size: 200
