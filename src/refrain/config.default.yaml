# Display destinations
destinations:
  - id: "default"
    type: "image-server"
    audience: "internal"

# Enable the image-server HTTP service with default settings.
image-server:

# Scheduling
scheduling:
  day_start: "05:00"
  reveal:
    source: "12:00"
    attribution: "18:00"

# Presentation
presentation:
  information_view:
    duration: 60
  qr:
    external: "https://github.com/ControlForgeHQ/refrain"
    internal: "https://github.com/ControlForgeHQ/refrain"

# Custom colors
palette:
  sage: "#8A9B79"
  slate: "#52657A"
  terracotta: "#C65A20"

# Fonts
fonts:
  pools:
    default:
      - "@builtin"
  faces:
    source: italic

# Text
text:
  colors:
    pools:
      default:
        - "@builtin"

# Backgrounds
backgrounds:
  pools:
    default:
      - "@builtin"
      - "none"

# Decorations
decorations:
  pools:
    default:
      - "@builtin"
      - "none"
  colors:
    pools:
      default:
        - "@builtin"
