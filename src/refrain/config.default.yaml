# This is the initial editable configuration installed by --initialize.
general:
  day_start: "05:00"

reveal:
  source: "12:00"
  attribution: "18:00"

information_view:
  duration: 60

destinations:
  - id: "default"
    type: "image-server"

# This optional section enables the loopback-only HTTP service.
image-server:
  host: "127.0.0.1"
  port: 8080

layout:
  presentation_insets:
    left: 384
    right: 384
    top: 324
    bottom: 324

  fonts:
    default:
      - "@builtin"
    font_faces:
      source: italic

  backgrounds:
    default:
      - "@builtin"
      - "none"

  decorations:
    default:
      - "@builtin"
      - "none"
    colors:
      default:
        - "@builtin"

  text:
    colors:
      default:
        - "@builtin"
    min_font_size: 56
    max_font_size: 200
