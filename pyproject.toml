[project]
name = "refrain"
version = "0.1.0"
description = "Hardware-independent quotation content loading and validation"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1,<27",
    "pytest>=8.3.5,<9",
    "ruff>=0.11.2,<1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
