general:
  timezone: "America/Toronto"
  day_start: "06:00"

content:
  directory: "content"

reveal:
  source: "12:00"
  attribution: "18:00"

information_view:
  duration: 60

display:
  backends:
    - type: "window"
    - type: "image-server"
      host: "127.0.0.1"
      port: 8080

layout:
  presentation_region:
    x: 0.10
    y: 0.15
    width: 0.80
    height: 0.55

  fonts:
    default:
      - "libre-baskerville"
      - "lora"
      - "source-sans-3"

  backgrounds:
    # Omission also preserves the plain paper-white appearance.
    default:
      - "none"
    # Bundled choices: aged-paper, canvas, cloth, ethereal, hex.
    # Custom readable, single-frame RGB/RGBA PNGs must be 1600 x 1200.
    # Paths are relative to this configuration file (absolute paths also work).
    # available:
    #   handmade-paper: "backgrounds/HandmadePaper.png"

  text:
    min_font_size: 28
    max_font_size: 100
