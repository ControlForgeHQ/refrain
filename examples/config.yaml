general:
  day_start: "06:00"

content:
  directory: "content"

reveal:
  source: "12:00"
  attribution: "18:00"

information_view:
  duration: 5

display:
  backends:
    - type: "window"
    - type: "image-server"
      host: "127.0.0.1"
      port: 8080

layout:
  presentation_region:
    x: 0.10
    y: 0.15
    width: 0.80
    height: 0.70

  fonts:
    # Bundled fonts are registered automatically.
    # Only fonts listed here participate in random selection.
    default:
      - "alegreya"
      - "libre-baskerville"
      - "lora"
      - "orbitron"
      - "source-sans-3"

    # Optional custom fonts.
    # available:
    #   my-lora: "fonts/MyCustomLora.otf"

  backgrounds:
    # Bundled backgrounds are registered automatically.
    # Use "none" to include the plain paper-white background.
    default:
      - "none"
      - "aged-paper"
      - "canvas"
      - "cloth"
      - "ethereal"
      - "hex"

    # Optional custom backgrounds. Images must be readable, single-frame
    # RGB/RGBA PNGs at 1600 x 1200.
    # Relative paths resolve from the directory containing config.yaml.
    # available:
    #   handmade-paper: "backgrounds/HandmadePaper.png"

  decorations:
    # Bundled decorations are registered automatically. Use "none" for no overlay.
    # Each member of the default pool is selected with equal probability.
    default:
      - "none"
      - "ethereal"
      - "hex"
      - "lower-flourish"
      - "simple-border"
      - "top-bottom-borders"

    # Optional custom transparent overlays must be readable, single-frame
    # 1600 x 1200 RGBA PNGs. Relative paths resolve from this configuration file.
    # available:
    #   botanical-corners:
    #     image: "decorations/BotanicalCorners.png"
    #     presentation_region: {x: 0.16, y: 0.18, width: 0.68, height: 0.58}
    #     font: "lora"
    #     background: "aged-paper"

  text:
    min_font_size: 28
    max_font_size: 100
