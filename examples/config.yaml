general:
  day_start: "06:00"

palette:
  terracotta: "#C65A20"

content:
  directory: "content"

reveal:
  source: "12:00"
  attribution: "18:00"

information_view:
  duration: 5

display:
  backends:
    - type: "window"
      aspect_ratio: "16:9"
      resolution: [1920, 1080]
    - type: "image-server"
      host: "127.0.0.1"
      port: 8080
      outputs:
        - id: "default"
          aspect_ratio: "16:10"
          resolution: [3840, 2400]

layout:
  presentation_insets:
    left: 384
    right: 384
    top: 324
    bottom: 324

  fonts:
    default:
      - "alegreya"
      - "libre-baskerville"
      - "lora"
      - "orbitron"
      - "source-sans-3"
    font_faces:
      attribution: italic

  backgrounds:
    default:
      - "none"
      - "aged-paper"
      - "canvas"
      - "cloth"
      - "drafting-grid"
      - "handmade-paper"
      - "hex"
      - "isometric-grid"
      - "limestone"
      - "recursive-squares"
      - "vellum"

  decorations:
    default:
      - "none"
      - "ethereal"
      - "hex"
      - "lower-flourish"
      - "simple-border"
      - "top-bottom-borders"
    colors:
      - "black"
      - "terracotta"

  text:
    colors:
      - "black"
    min_font_size: 28
    max_font_size: 100
